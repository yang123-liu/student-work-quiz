<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生工作自评问卷 · 管理后台</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --line:#e3e8f0; --tx:#1a2333; --tx2:#5a6b85; --tx3:#93a1b8;
    --pri:#3d6bfa; --pri2:#2b4fd8; --ok:#2e7d32; --warn:#c62828;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);padding:24px}
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-size:22px;margin-bottom:4px}
  .sub{color:var(--tx2);font-size:13px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 1px 3px rgba(20,30,60,.05)}
  /* 登录 */
  .login{max-width:420px;margin:80px auto;text-align:center}
  .login .card{padding:32px}
  .login h2{font-size:18px;margin-bottom:16px}
  input[type=password],input[type=text],input[type=search]{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;outline:none;margin-bottom:12px
  }
  input:focus{border-color:var(--pri)}
  button{cursor:pointer;border:none;border-radius:8px;padding:10px 18px;font-size:14px;background:var(--pri);color:#fff}
  button:hover{background:var(--pri2)}
  button.sec{background:#eef2fb;color:var(--pri)}
  button:disabled{opacity:.5;cursor:not-allowed}
  /* 工具条 */
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar .stat{font-size:13px;color:var(--tx2)}
  .toolbar .spacer{flex:1}
  .toolbar input[type=search]{width:260px;margin:0}
  .toolbar button{display:inline-flex;align-items:center;gap:6px}
  /* 表格 */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:#f7f9fd;color:var(--tx2);font-weight:600;white-space:nowrap;position:sticky;top:0}
  tr:hover td{background:#f8faff}
  td.center{text-align:center}
  .chip{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:600;margin:1px 2px 1px 0}
  .chip.hol{background:#f0e7ff;color:#6a3fd8}
  .chip.mb{background:#e6f4ff;color:#0b6bcb}
  .chip.goal{background:#fff4e0;color:#b26a00}
  .chip.dir{background:#e7f8ef;color:#1e8e54}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;margin-right:4px;color:#fff}
  .tdir{width:100px}
  .row-del{color:var(--warn);background:none;border:none;padding:2px 6px;font-size:12px;cursor:pointer}
  .row-del:hover{text-decoration:underline}
  .empty{text-align:center;color:var(--tx3);padding:30px}
  /* 弹窗 */
  .overlay{position:fixed;inset:0;background:rgba(10,20,40,.45);display:none;align-items:center;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:12px;padding:20px;width:560px;max-width:92vw;max-height:84vh;overflow:auto}
  .modal h3{margin-bottom:14px}
  .modal .kv{margin-bottom:8px;font-size:14px}
  .modal .kv b{color:var(--tx2);display:inline-block;width:70px}
  .close{float:right;background:#eef1f6;color:var(--tx2)}
  .dirs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .dirs .d{background:#f7f9fd;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .dirs .d b{display:block;font-size:13px;margin-bottom:2px}
  .dirs .d span{font-size:12px;color:var(--tx2)}
  .bar{height:6px;background:#e8edf5;border-radius:4px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#7aa2ff)}
  .ans{font-size:12px;color:var(--tx2);white-space:pre-wrap}
  .hidden{display:none}
  .warn-msg{color:var(--warn);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="login" id="loginBox">
    <div class="card">
      <h2>🔒 管理后台登录</h2>
      <input type="password" id="tokenInput" placeholder="请输入管理密码">
      <button id="loginBtn" style="width:100%">登录</button>
      <div class="warn-msg" id="loginErr"></div>
    </div>
  </div>

  <div id="adminBox" class="hidden">
    <h1>📊 学生工作自评 · 结果后台</h1>
    <div class="sub">查看学生提交记录、搜索、导出 CSV。提交时间采用服务器时间。</div>

    <div class="card">
      <div class="toolbar">
        <span class="stat">共 <b id="totalCount">0</b> 条记录</span>
        <span class="spacer"></span>
        <input type="search" id="searchInput" placeholder="搜索姓名 / 学校 / 专业 / 方向">
        <button id="refreshBtn">⟳ 刷新</button>
        <button id="exportBtn">⬇ 导出 CSV</button>
        <button class="sec" id="logoutBtn">退出</button>
      </div>
      <div style="overflow:auto;max-height:70vh">
        <table>
          <thead><tr>
            <th>#</th><th>提交时间</th><th>姓名</th><th>学校</th><th>专业</th>
            <th>霍兰德</th><th>MBTI</th><th>未来方向</th>
            <th>第一方向</th><th>第二方向</th><th>建议岗位</th><th style="width:40px"></th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="emptyTip" style="display:none">暂无记录</div>
      </div>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <button class="close" onclick="closeDetail()">✕</button>
    <h3 id="detailName">详情</h3>
    <div id="detailBody"></div>
  </div>
</div>

<script>
let TOKEN = localStorage.getItem('quizAdminToken') || '';
let RECORDS = [];
const DIM_ORDER = ['M','C','S','A','E','V'];
const DIM_NAMES = {M:'统筹管理',C:'内容创意',S:'对外沟通',A:'专业学术',E:'活动执行',V:'服务支持'};

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// —— 登录 ——
function initLogin(){
  if(TOKEN){ showAdmin(); } else { showLogin(); }
}
function showLogin(){ document.getElementById('loginBox').style.display='block'; document.getElementById('adminBox').classList.add('hidden'); }
function showAdmin(){ document.getElementById('loginBox').style.display='none'; document.getElementById('adminBox').classList.remove('hidden'); loadRecords(); }

document.getElementById('loginBtn').onclick = async () => {
  const token = document.getElementById('tokenInput').value.trim();
  const err = document.getElementById('loginErr');
  if(!token){ err.textContent = '请输入管理密码'; return; }
  const r = await fetch('/api/records', { headers: {'x-admin-token': token} });
  if(r.status === 401){ err.textContent = '密码错误'; return; }
  TOKEN = token; localStorage.setItem('quizAdminToken', token);
  err.textContent = ''; showAdmin();
};

// —— 数据加载 ——
async function loadRecords(){
  try{
    const r = await fetch('/api/records', { headers: {'x-admin-token': TOKEN} });
    if(r.status === 401){ showLogin(); return; }
    const j = await r.json();
    RECORDS = j.records || [];
    render();
  }catch(e){ /* 忽略 */ }
}

function render(){
  const kw = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  let list = RECORDS;
  if(kw){
    list = list.filter(r =>
      [r.name, r.school, r.major, r.top?.t1Name, r.top?.t2Name, r.top?.job]
        .join(' ').toLowerCase().includes(kw));
  }
  document.getElementById('totalCount').textContent = list.length;
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyTip');
  if(!list.length){ tbody.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  tbody.innerHTML = list.map((r,i)=>{
    const hol = [r.hol?.A, r.hol?.B, r.hol?.C].filter(Boolean).map(c=>`<span class="chip hol">${c}</span>`).join('') || '—';
    const mb = [r.mbti?.E, r.mbti?.S, r.mbti?.T, r.mbti?.J].filter(Boolean).join('') || '—';
    const p = r.top || {};
    return `<tr>
      <td class="center">${list.length - i}</td>
      <td style="white-space:nowrap">${new Date(r.time).toLocaleString('zh-CN',{hour12:false})}</td>
      <td><b>${esc(r.name)}</b></td>
      <td>${esc(r.school)||'—'}</td>
      <td>${esc(r.major)||'—'}</td>
      <td>${hol}</td>
      <td>${mb ? `<span class="chip mb">${esc(mb)}</span>` : '—'}</td>
      <td>${r.goal ? `<span class="chip goal">${esc(r.goal)}</span>` : '—'}</td>
      <td>${p.t1Name ? `<span class="chip dir">${esc(p.t1Name)} ${p.t1Score ?? ''}</span>` : '—'}</td>
      <td>${p.t2Name ? `<span class="chip dir">${esc(p.t2Name)} ${p.t2Score ?? ''}</span>` : '—'}</td>
      <td>${esc(p.job)||'—'}</td>
      <td class="center"><button class="row-del" onclick="showDetail('${r.id}')">详情</button></td>
    </tr>`;
  }).join('');
}

// —— 搜索 / 刷新 ——
document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('refreshBtn').onclick = loadRecords;
document.getElementById('logoutBtn').onclick = () => { TOKEN=''; localStorage.removeItem('quizAdminToken'); showLogin(); };

// —— 导出 ——
document.getElementById('exportBtn').onclick = async () => {
  try{
    const r = await fetch('/api/export?token=' + encodeURIComponent(TOKEN));
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = '学生工作自评结果.csv'; a.click();
    URL.revokeObjectURL(url);
  }catch(e){ alert('导出失败：' + e.message); }
};

// —— 详情弹窗 ——
function showDetail(id){
  const r = RECORDS.find(x => x.id === id); if(!r) return;
  const s = r.scores || {};
  const p = r.top || {};
  const dirs = DIM_ORDER.map(k => {
    const v = s[k]; if(v == null) return '';
    const pct = Math.min(100, Math.round(v)); // 百分比条
    return `<div class="d"><b>${DIM_NAMES[k]} <span>${v} 分</span></b>
      <div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join('');
  document.getElementById('detailName').textContent = r.name ? `${r.name} 的测评结果` : '测评结果';
  document.getElementById('detailBody').innerHTML = `
    <div class="kv"><b>学校</b>${esc(r.school)||'—'}</div>
    <div class="kv"><b>专业</b>${esc(r.major)||'—'}</div>
    <div class="kv"><b>提交时间</b>${new Date(r.time).toLocaleString('zh-CN',{hour12:false})}</div>
    <div class="kv"><b>霍兰德</b>${[r.hol?.A, r.hol?.B, r.hol?.C].filter(Boolean).join(' · ') || '—'}
      <span style="color:var(--tx3)">（主导 · 辅助① · 辅助②）</span></div>
    <div class="kv"><b>MBTI</b>${[r.mbti?.E, r.mbti?.S, r.mbti?.T, r.mbti?.J].filter(Boolean).join('') || '—'}</div>
    <div class="kv"><b>未来方向</b>${esc(r.goal)||'—'}</div>
    <div class="kv"><b>第一方向</b>${esc(p.t1Name)}（${p.t1Score ?? ''} 分）</div>
    <div class="kv"><b>第二方向</b>${esc(p.t2Name)||'—'}${p.t2Score != null ? '（'+p.t2Score+' 分）' : ''}</div>
    <div class="kv"><b>建议岗位</b>${esc(p.job)||'—'} ${esc(p.jobAlt)||''}</div>
    <div class="dirs">${dirs}</div>
    <div class="kv"><b>自评答案</b><br><div class="ans">${esc((r.ans||[]).join('')) || '—'}</div></div>`;
  document.getElementById('detailOverlay').classList.add('show');
}
function closeDetail(){ document.getElementById('detailOverlay').classList.remove('show'); }
document.getElementById('detailOverlay').addEventListener('click', e => {
  if(e.target.id === 'detailOverlay') closeDetail();
});

initLogin();
</script>
</body>
</html>
